<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Mirops compatibility catalog flow</title><desc id="desc">Vendor compatibility documentation informs reviewed add-on rules. Validation checks the catalog and generates a matrix. A versioned OCI artifact can be pulled into an optional Helm ConfigMap override, while the operator also carries an embedded snapshot.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#fdf2f8"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="430" rx="28" fill="url(#bg)"/><text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#172554">From vendor evidence to compatibility findings</text>
<g filter="url(#s)"><rect x="35" y="145" width="175" height="135" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="270" y="145" width="175" height="135" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="505" y="145" width="175" height="135" rx="18" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="740" y="145" width="175" height="135" rx="18" fill="#fff" stroke="#fda4af" stroke-width="2"/><rect x="975" y="85" width="190" height="105" rx="18" fill="#fff" stroke="#fdba74" stroke-width="2"/><rect x="975" y="235" width="190" height="105" rx="18" fill="#fff" stroke="#a5b4fc" stroke-width="2"/></g>
<text x="122" y="184" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Vendor sources</text><text x="122" y="214" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Supported versions</text><text x="122" y="241" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Cited evidence</text>
<text x="357" y="184" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d28d9">Add-on rules</text><text x="357" y="214" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Version ranges</text><text x="357" y="241" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Reviewed in PRs</text>
<text x="592" y="184" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#047857">Validation + build</text><text x="592" y="214" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Schema and rules</text><text x="592" y="241" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Generates matrix.yaml</text>
<text x="827" y="184" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#be123c">OCI snapshot</text><text x="827" y="214" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Dated + latest tags</text><text x="827" y="241" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Frozen catalog view</text>
<text x="1070" y="124" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#c2410c">Optional override</text><text x="1070" y="152" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Helm ConfigMap</text><text x="1070" y="174" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">Select a pinned snapshot</text>
<text x="1070" y="275" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#4338ca">Mirops operator</text><text x="1070" y="302" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Embedded or override</text><text x="1070" y="324" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">Reports findings</text>
<path d="M210 212H259" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M445 212H494" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M680 212H729" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M915 190C940 190 944 137 964 137" stroke="#f97316" stroke-width="3" marker-end="url(#a)"/><path d="M915 250C940 250 944 287 964 287" stroke="#4338ca" stroke-width="3" marker-end="url(#a)"/><path d="M1070 190V224" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="48" y="385" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">The operator never pulls from a registry at runtime; the embedded snapshot remains available offline.</text></svg>