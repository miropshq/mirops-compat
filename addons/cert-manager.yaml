name: cert-manager
displayName: cert-manager
source: https://cert-manager.io/docs/releases/
lastVerified: "2026-06"
# Only the two latest releases are officially supported at a time; older rows are extrapolated.
rules:
  - addonRange: ">=1.15.0 <1.16.0"
    k8sRange: ">=1.25.0 <=1.30.0"
    bestEffort: true
  - addonRange: ">=1.16.0 <1.17.0"
    k8sRange: ">=1.27.0 <=1.31.0"
    bestEffort: true
  - addonRange: ">=1.17.0 <1.18.0"
    k8sRange: ">=1.28.0 <=1.32.0"
    bestEffort: true
  - addonRange: ">=1.18.0 <1.19.0"
    k8sRange: ">=1.29.0 <=1.34.0"
    bestEffort: true
  - addonRange: ">=1.19.0 <1.20.0"
    k8sRange: ">=1.31.0 <=1.35.0"
  - addonRange: ">=1.20.0"
    k8sRange: ">=1.32.0 <=1.36.0"
