name: CI - Feature / PR (validate)

# Validation-only pipeline. Runs on every PR targeting main. It never pushes
# images or artifacts — it only proves the code is sound so a green check means
# the PR is safe to merge.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # yq and pipx already ship with the ubuntu-latest runner image.
      - name: Install check-jsonschema
        run: pipx install check-jsonschema

      - name: Schema-check add-on files
        run: check-jsonschema --schemafile schema/addon.schema.json addons/*.yaml

      # Merge addons/*.yaml (rich, per-add-on) into dist/matrix.yaml (the flat shape the operator
      # embeds and loads).
      - name: Build the merged matrix
        run: |
          mkdir -p dist
          {
            echo "# GENERATED — do not edit. Source of truth: addons/*.yaml"
            # Collapse every addon file into { addons: { <name>: [ {addonRange,k8sRange}, ... ] } }
            # [.] gathers all documents into one array first, so the result is a single document.
            yq eval-all '
              [.] | {"addons": (map({"key": .name, "value": [ .rules[] | {"addonRange": .addonRange, "k8sRange": .k8sRange} ]}) | from_entries)}
            ' addons/*.yaml
          } > dist/matrix.yaml

      - name: Sanity — matrix parses and has add-ons
        run: |
          count=$(yq '.addons | length' dist/matrix.yaml)
          echo "add-ons in matrix: $count"
          test "$count" -gt 0

      # Hand the exact validated file to the publish job instead of rebuilding it there.
      - uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: dist/matrix.yaml
          if-no-files-found: error