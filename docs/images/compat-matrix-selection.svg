<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
<title id="title">Mirops compatibility matrix selection</title><desc id="desc">The operator uses its embedded compatibility snapshot by default. If an administrator provides the mirops-compatibility-matrix ConfigMap, the override takes precedence. The ConfigMap may be populated from a pinned OCI snapshot using Helm.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfeff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1100" height="380" rx="26" fill="url(#bg)"/><text x="48" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">The override wins; the embedded matrix is always available</text>
<g filter="url(#s)"><rect x="50" y="120" width="220" height="125" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="50" y="270" width="220" height="70" rx="16" fill="#fff" stroke="#fdba74" stroke-width="2"/><rect x="365" y="185" width="190" height="100" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="650" y="185" width="190" height="100" rx="18" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="925" y="185" width="140" height="100" rx="18" fill="#fff" stroke="#f9a8d4" stroke-width="2"/></g>
<text x="160" y="160" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Embedded snapshot</text><text x="160" y="191" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Baked into operator image</text><text x="160" y="217" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Default · offline safe</text>
<text x="160" y="299" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#c2410c">Versioned OCI snapshot</text><text x="160" y="323" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">Pulled at deploy time</text>
<text x="460" y="222" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d28d9">Helm selection</text><text x="460" y="251" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Optional matrix pull</text>
<text x="745" y="222" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#047857">ConfigMap</text><text x="745" y="251" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">mirops-compatibility-matrix</text>
<text x="995" y="222" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#9d174d">Operator</text><text x="995" y="251" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#334155">Override if present</text>
<path d="M270 305H335C350 305 345 255 354 255" stroke="#f97316" stroke-width="3" marker-end="url(#a)"/ fill="none"><path d="M555 235H639" stroke="#10b981" stroke-width="3" marker-end="url(#a)"/ fill="none"><path d="M840 235H914" stroke="#db2777" stroke-width="3" marker-end="url(#a)"/ fill="none"><path d="M270 170C590 100 820 118 930 194" stroke="#3b82f6" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#a)"/ fill="none">
<text x="48" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">If the ConfigMap is absent, the operator reads its embedded snapshot; it never contacts GHCR at runtime.</text></svg>