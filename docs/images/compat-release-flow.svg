<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Mirops compatibility catalog release workflow</title><desc id="desc">A pull request updates source-backed add-on rules. CI validates schema and catalog invariants, then the release workflow generates dist/matrix.yaml and pushes a date-tagged and latest OCI artifact. Helm can pin a published snapshot, and a future operator release can embed it.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f3ff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="390" rx="26" fill="url(#bg)"/><text x="48" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">A reviewed rule change becomes a pinned catalog snapshot</text>
<g filter="url(#s)"><rect x="35" y="130" width="175" height="130" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="270" y="130" width="175" height="130" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="505" y="130" width="175" height="130" rx="18" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="740" y="130" width="175" height="130" rx="18" fill="#fff" stroke="#fda4af" stroke-width="2"/><rect x="975" y="130" width="190" height="130" rx="18" fill="#fff" stroke="#fdba74" stroke-width="2"/></g>
<text x="122" y="168" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Rule PR</text><text x="122" y="199" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Vendor source</text><text x="122" y="225" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">addonRange → k8sRange</text>
<text x="357" y="168" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d28d9">CI validation</text><text x="357" y="199" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Schema + invariants</text><text x="357" y="225" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Review, then merge</text>
<text x="592" y="168" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#047857">Matrix build</text><text x="592" y="199" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">dist/matrix.yaml</text><text x="592" y="225" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Generated from rules</text>
<text x="827" y="168" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#be123c">OCI publish</text><text x="827" y="199" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">vYYYY.MM.DD</text><text x="827" y="225" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Also update latest</text>
<text x="1070" y="168" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#c2410c">Use snapshot</text><text x="1070" y="199" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Pin in Helm, or embed</text><text x="1070" y="225" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Operator consumes matrix</text>
<path d="M210 195H259" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M445 195H494" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M680 195H729" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M915 195H964" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<text x="48" y="320" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">The OCI artifact is pulled during chart deployment when enabled; the operator does not fetch registry data at runtime.</text></svg>