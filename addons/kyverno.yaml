name: kyverno
displayName: Kyverno
source: https://kyverno.io/docs/installation/releases/
lastVerified: "2026-08"
# N-2 policy: only the current and previous two minors are tested. 1.18 taken from the releases page;
# 1.11–1.16 from the archived per-version docs (release-1-13-0/1-15-0/1-17-0.kyverno.io).
# 1.17 has no published matrix row — extrapolated from the +1 minor cadence.
rules:
  - addonRange: ">=1.11.0 <1.12.0"
    k8sRange: ">=1.25.0 <=1.28.0"
  - addonRange: ">=1.12.0 <1.13.0"
    k8sRange: ">=1.26.0 <=1.29.0"
  - addonRange: ">=1.13.0 <1.14.0"
    k8sRange: ">=1.28.0 <=1.31.0"
  - addonRange: ">=1.14.0 <1.15.0"
    k8sRange: ">=1.29.0 <=1.32.0"
  - addonRange: ">=1.15.0 <1.16.0"
    k8sRange: ">=1.30.0 <=1.33.0"
  - addonRange: ">=1.16.0 <1.17.0"
    k8sRange: ">=1.31.0 <=1.34.0"
  - addonRange: ">=1.17.0 <1.18.0"
    k8sRange: ">=1.32.0 <=1.35.0"
    bestEffort: true
  - addonRange: ">=1.18.0"
    k8sRange: ">=1.33.0 <=1.35.0"
