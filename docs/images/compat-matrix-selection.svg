<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
<title id="title">Mirops compatibility matrix selection</title>
<desc id="desc">The operator uses its embedded compatibility snapshot by default. Administrators may use Helm to populate the compatibility ConfigMap from a versioned OCI snapshot. When the ConfigMap exists, it overrides the embedded matrix. Connectors use SVG lines.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfeff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter>
</defs>
<rect width="1100" height="380" rx="26" fill="url(#bg)"/>
<text x="48" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">The override wins; the embedded matrix is always available</text>
<g filter="url(#shadow)">
 <rect x="45" y="115" width="220" height="115" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
 <rect x="45" y="265" width="220" height="75" rx="16" fill="#fff" stroke="#fdba74" stroke-width="2"/>
 <rect x="365" y="230" width="190" height="100" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
 <rect x="650" y="230" width="190" height="100" rx="18" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
 <rect x="935" y="185" width="140" height="125" rx="18" fill="#fff" stroke="#f9a8d4" stroke-width="2"/>
</g>
<text x="155" y="153" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Embedded snapshot</text>
<text x="155" y="183" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Baked into operator image</text>
<text x="155" y="208" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Default · works offline</text>
<text x="155" y="295" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#c2410c">Versioned OCI snapshot</text>
<text x="155" y="321" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">Pulled during deployment</text>
<text x="460" y="268" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d28d9">Helm selection</text>
<text x="460" y="297" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">Optional matrix pull</text>
<text x="745" y="268" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#047857">ConfigMap</text>
<text x="745" y="297" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#334155">mirops-compatibility-matrix</text>
<text x="1005" y="228" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#9d174d">Operator</text>
<text x="1005" y="258" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#334155">Uses override</text>
<text x="1005" y="281" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#334155">if present</text>
<line x1="265" y1="170" x2="935" y2="220" stroke="#3b82f6" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<line x1="265" y1="302" x2="365" y2="280" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="555" y1="280" x2="650" y2="280" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="840" y1="280" x2="935" y2="260" stroke="#db2777" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="135" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">Default: embedded snapshot</text>
<text x="48" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">The operator never contacts GHCR at runtime; an absent ConfigMap leaves the embedded matrix in use.</text>
</svg>