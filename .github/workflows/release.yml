name: Release OCI matrix compatibility for Mirops

on:
  pull_request:
  push:
    branches: [main]

# Same failure semantics the scripts had (set -eo pipefail).
defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # yq and pipx already ship with the ubuntu-latest runner image.
      - name: Install check-jsonschema
        run: pipx install check-jsonschema

      - name: Install Python script dependencies
        run: python -m pip install PyYAML

      - name: Schema-check add-on files
        run: check-jsonschema --schemafile schema/addon.schema.json addons/*.yaml

      - name: Cross-file catalog validation
        run: python scripts/validate_addons.py

      # Merge addons/*.yaml (rich, per-add-on) into dist/matrix.yaml (the flat shape the operator
      # embeds and loads).
      - name: Build the merged matrix
        run: |
          mkdir -p dist
          python scripts/build_matrix.py

      - name: Sanity — matrix parses and has add-ons
        run: |
          count=$(yq '.addons | length' dist/matrix.yaml)
          echo "add-ons in matrix: $count"
          test "$count" -gt 0

      # Hand the exact validated file to the publish job instead of rebuilding it there.
      - uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: dist/matrix.yaml
          if-no-files-found: error

  # On push to main, publish the OCI artifact to GHCR. PRs only run the validate job above.
  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      REPO: ghcr.io/miropshq/mirops-compat
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      
      - uses: oras-project/setup-oras@v2

      - uses: actions/download-artifact@v4
        with:
          name: matrix
          path: dist
          
      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the matrix as a single-file OCI artifact with a descriptive media type.
      # The tag is the UTC date of the upload: vYYYY.MM.DD.
      - name: Publish the OCI artifact
        run: |
          tag="v$(date -u +%Y.%m.%d)"
          oras push "${REPO}:${tag}" \
            --artifact-type application/vnd.mirops.compat.matrix.v1 \
            dist/matrix.yaml:application/yaml
          # Also move the 'latest' tag to this build, so consumers can pull the newest matrix
          # without knowing the date (pin the date tag for reproducible builds).
          oras tag "${REPO}:${tag}" latest
          echo "published ${REPO}:${tag} (also tagged latest)"

      - name: Notify Slack
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.workflow }} ${{ job.status }} for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.workflow }}* — *${{ job.status }}*\n`${{ github.repository }}` · `${{ github.ref_name }}` · `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }
